<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="100%" stop-color="#111B30"/>
    </linearGradient>
    <linearGradient id="sop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="hGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0"/>
      <stop offset="15%" stop-color="#065F46" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#065F46" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#065F46" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wideGlow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" fill="#F1F5F9" font-size="30" font-weight="700" letter-spacing="0.5">Long-Horizon Autonomous AI Employee</text>
  <text x="800" y="82" text-anchor="middle" fill="#64748B" font-size="15">SOP drives the horizon. Harness drives the depth.</text>

  <!-- ════════════════ SOP LAYER ════════════════ -->

  <!-- Label -->
  <text x="155" y="148" fill="#60A5FA" font-size="22" font-weight="700" letter-spacing="3">SOP LAYER</text>
  <text x="155" y="166" fill="#475569" font-size="11">The Long Horizon</text>

  <!-- Beam glow -->
  <line x1="200" y1="200" x2="1400" y2="200" stroke="url(#sop)" stroke-width="6" opacity="0.25" filter="url(#wideGlow)"/>
  <!-- Beam -->
  <line x1="200" y1="200" x2="1400" y2="200" stroke="url(#sop)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrow tip -->
  <polygon points="1400,193 1418,200 1400,207" fill="#06B6D4" filter="url(#sg)"/>
  <!-- Time label -->
  <text x="1430" y="204" fill="#475569" font-size="11" font-weight="500">time</text>

  <!-- Phase nodes -->
  <!-- P1: Specify -->
  <circle cx="300" cy="200" r="18" fill="#0B1222" stroke="#3B82F6" stroke-width="2.5"/>
  <circle cx="300" cy="200" r="18" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <circle cx="300" cy="200" r="5" fill="#3B82F6"/>
  <text x="300" y="243" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Specify</text>

  <!-- P2: Research -->
  <circle cx="530" cy="200" r="18" fill="#0B1222" stroke="#2D8CF2" stroke-width="2.5"/>
  <circle cx="530" cy="200" r="18" fill="none" stroke="#2D8CF2" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <circle cx="530" cy="200" r="5" fill="#2D8CF2"/>
  <text x="530" y="243" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Research</text>

  <!-- P3: Create -->
  <circle cx="760" cy="200" r="18" fill="#0B1222" stroke="#1E9DD6" stroke-width="2.5"/>
  <circle cx="760" cy="200" r="18" fill="none" stroke="#1E9DD6" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <circle cx="760" cy="200" r="5" fill="#1E9DD6"/>
  <text x="760" y="243" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Create</text>

  <!-- P4: Review -->
  <circle cx="990" cy="200" r="18" fill="#0B1222" stroke="#10ADC8" stroke-width="2.5"/>
  <circle cx="990" cy="200" r="18" fill="none" stroke="#10ADC8" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <circle cx="990" cy="200" r="5" fill="#10ADC8"/>
  <text x="990" y="243" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Review</text>

  <!-- P5: Deploy -->
  <circle cx="1220" cy="200" r="18" fill="#0B1222" stroke="#06B6D4" stroke-width="2.5"/>
  <circle cx="1220" cy="200" r="18" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <circle cx="1220" cy="200" r="5" fill="#06B6D4"/>
  <text x="1220" y="243" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Deploy</text>

  <!-- ════════════════ HARNESS LAYER ════════════════ -->

  <!-- Label (rotated, left side) -->
  <text x="42" y="490" fill="#A78BFA" font-size="22" font-weight="700" letter-spacing="3" transform="rotate(-90,42,490)">HARNESS LAYER</text>
  <text x="72" y="490" fill="#475569" font-size="11" transform="rotate(-90,72,490)">The Depth</text>

  <!-- Depth arrow -->
  <line x1="98" y1="270" x2="98" y2="740" stroke="#334155" stroke-width="1"/>
  <polygon points="95,740 98,752 101,740" fill="#334155"/>

  <!-- Depth level labels + guide lines -->
  <text x="128" y="318" fill="#475569" font-size="10" text-anchor="end">Plan</text>
  <line x1="133" y1="315" x2="150" y2="315" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="128" y="418" fill="#475569" font-size="10" text-anchor="end">Execute</text>
  <line x1="133" y1="415" x2="150" y2="415" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="128" y="518" fill="#475569" font-size="10" text-anchor="end">Observe</text>
  <line x1="133" y1="515" x2="150" y2="515" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="128" y="618" fill="#475569" font-size="10" text-anchor="end">Evaluate</text>
  <line x1="133" y1="615" x2="150" y2="615" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="128" y="718" fill="#475569" font-size="10" text-anchor="end">Adapt</text>
  <line x1="133" y1="715" x2="150" y2="715" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ── P1 Harness (shallow: Plan + Execute) ── -->
  <rect x="268" y="260" width="64" height="185" rx="32" fill="url(#hGlow)"/>
  <rect x="275" y="265" width="50" height="175" rx="25" fill="url(#h)"/>
  <line x1="300" y1="270" x2="300" y2="430" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.25"/>
  <circle cx="300" cy="315" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="300" cy="415" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <text x="330" y="419" fill="#64748B" font-size="9" opacity="0.7">conversation tools</text>
  <!-- Human gate on Specify -->
  <rect x="317" y="304" width="48" height="22" rx="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity="0.65"/>
  <text x="341" y="319" text-anchor="middle" fill="#34D399" font-size="9" font-weight="600" opacity="0.75">HUMAN</text>

  <!-- ── P2 Harness (deepest: all 5 levels) ── -->
  <rect x="498" y="260" width="64" height="490" rx="32" fill="url(#hGlow)"/>
  <rect x="505" y="265" width="50" height="480" rx="25" fill="url(#h)"/>
  <line x1="530" y1="270" x2="530" y2="740" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>
  <circle cx="530" cy="315" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="530" cy="415" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="530" cy="515" r="5.5" fill="#C084FC" filter="url(#sg)"/>
  <circle cx="530" cy="615" r="5.5" fill="#D946EF" filter="url(#sg)"/>
  <circle cx="530" cy="715" r="5.5" fill="#F472B6" filter="url(#sg)"/>
  <text x="560" y="419" fill="#64748B" font-size="9" opacity="0.7">multi-agent orchestration</text>
  <text x="560" y="519" fill="#64748B" font-size="9" opacity="0.7">quality check</text>
  <!-- Adapt loop -->
  <path d="M548,715 C578,715 578,615 548,615" fill="none" stroke="#F472B6" stroke-width="1.5" opacity="0.5"/>
  <polygon points="548,610 553,620 543,620" fill="#F472B6" opacity="0.5"/>
  <text x="586" y="670" fill="#F472B6" font-size="9" opacity="0.5">retry / replan</text>

  <!-- ── P3 Harness (deep: 4 levels) ── -->
  <rect x="728" y="260" width="64" height="390" rx="32" fill="url(#hGlow)"/>
  <rect x="735" y="265" width="50" height="380" rx="25" fill="url(#h)"/>
  <line x1="760" y1="270" x2="760" y2="640" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.28"/>
  <circle cx="760" cy="315" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="760" cy="415" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="760" cy="515" r="5.5" fill="#C084FC" filter="url(#sg)"/>
  <circle cx="760" cy="615" r="5.5" fill="#D946EF" filter="url(#sg)"/>
  <text x="790" y="419" fill="#64748B" font-size="9" opacity="0.7">code gen / synthesis</text>

  <!-- ── P4 Harness (medium: 3 levels + human gate) ── -->
  <rect x="958" y="260" width="64" height="290" rx="32" fill="url(#hGlow)"/>
  <rect x="965" y="265" width="50" height="280" rx="25" fill="url(#h)"/>
  <line x1="990" y1="270" x2="990" y2="540" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.25"/>
  <circle cx="990" cy="315" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="990" cy="415" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="990" cy="515" r="5.5" fill="#C084FC" filter="url(#sg)"/>
  <!-- Human gate on Review -->
  <rect x="1012" y="504" width="48" height="22" rx="5" fill="none" stroke="#34D399" stroke-width="1.2" opacity="0.65"/>
  <text x="1036" y="519" text-anchor="middle" fill="#34D399" font-size="9" font-weight="600" opacity="0.75">HUMAN</text>

  <!-- ── P5 Harness (shallow: Plan + Execute) ── -->
  <rect x="1188" y="260" width="64" height="185" rx="32" fill="url(#hGlow)"/>
  <rect x="1195" y="265" width="50" height="175" rx="25" fill="url(#h)"/>
  <line x1="1220" y1="270" x2="1220" y2="430" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.22"/>
  <circle cx="1220" cy="315" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <circle cx="1220" cy="415" r="5.5" fill="#A78BFA" filter="url(#sg)"/>
  <text x="1250" y="419" fill="#64748B" font-size="9" opacity="0.7">deploy / notify</text>

  <!-- ════════════════ CONTEXT FLOW ════════════════ -->
  <path d="M310,430 C360,480 470,460 520,320" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.2"/>
  <path d="M540,735 C600,770 700,760 750,320" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.2"/>
  <path d="M770,635 C830,670 930,660 980,320" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.2"/>
  <path d="M1000,535 C1060,570 1160,560 1210,320" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.2"/>

  <!-- ════════════════ MEMORY BAND ════════════════ -->
  <rect x="200" y="790" width="1200" height="28" rx="14" fill="url(#mem)"/>
  <text x="800" y="809" text-anchor="middle" fill="#34D399" font-size="11" font-weight="500" opacity="0.5">Memory &amp; Learning  &#8212;  persists across sessions</text>

  <!-- ════════════════ LEGEND ════════════════ -->
  <g transform="translate(320,860)">
    <circle cx="0" cy="0" r="4" fill="#A78BFA"/>
    <text x="10" y="4" fill="#64748B" font-size="10">Harness Activity</text>

    <line x1="135" y1="-3" x2="160" y2="-3" stroke="#10B981" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.4"/>
    <text x="168" y="4" fill="#64748B" font-size="10">Artifact Flow</text>

    <path d="M300,-6 C316,-6 316,6 300,6" fill="none" stroke="#F472B6" stroke-width="1.5" opacity="0.5"/>
    <text x="324" y="4" fill="#64748B" font-size="10">Adapt Loop</text>

    <rect x="430" y="-9" width="36" height="18" rx="4" fill="none" stroke="#34D399" stroke-width="1" opacity="0.6"/>
    <text x="474" y="4" fill="#64748B" font-size="10">Human Gate</text>

    <rect x="570" y="-5" width="20" height="10" rx="5" fill="#065F46" opacity="0.4"/>
    <text x="598" y="4" fill="#64748B" font-size="10">Memory</text>
  </g>

  <!-- Annotations -->
  <g opacity="0.35">
    <line x1="300" y1="455" x2="300" y2="480" stroke="#475569" stroke-width="0.8"/>
    <line x1="300" y1="480" x2="380" y2="480" stroke="#475569" stroke-width="0.8"/>
    <text x="385" y="484" fill="#475569" font-size="9">human-driven, shallow tools</text>
  </g>
  <g opacity="0.35">
    <line x1="530" y1="750" x2="530" y2="770" stroke="#475569" stroke-width="0.8"/>
    <line x1="530" y1="770" x2="410" y2="770" stroke="#475569" stroke-width="0.8"/>
    <text x="260" y="774" fill="#475569" font-size="9">complex phase, deep harness with retry</text>
  </g>
</svg>
